name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: python3 scripts/validate_release_version.py

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src tests examples extras -type f \
            \( -name '*.h' -o -name '*.cpp' -o -name '*.ino' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit library boundaries and content encoding
        run: |
          if grep -RInE '#include[[:space:]]+[<"](Accord|Flow|Fresh|Link|Phase|Pulse|Seal|Signal|Tempo|Trace|Worker)\.h[>"]' src; then
            echo "Curier must not depend on another ZekStack library"
            exit 1
          fi
          if grep -RInE '"aesgcm"|Content-Encoding:[[:space:]]+aesgcm' src; then
            echo "Legacy aesgcm encoding is forbidden"
            exit 1
          fi

  host-tests:
    runs-on: ubuntu-latest
    needs: source-audit
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host protocol tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -Itests/host/stubs \
            -Isrc \
            src/internal/CurierProtocol.cpp \
            src/internal/CurierRetry.cpp \
            tests/host/test_retry_protocol.cpp \
            -o /tmp/curier-host-tests
          /tmp/curier-host-tests

  build-examples:
    runs-on: ubuntu-latest
    needs: [source-audit, host-tests]
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-p4-evboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
      - name: Install PIOArduino
        run: |
          python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"
          pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"
      - name: Build examples
        run: |
          set -e
          for sketch in examples/*; do
            pio ci "$sketch" \
              --board "${{ matrix.board }}" \
              --lib="." \
              --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
              --project-option "lib_deps=bblanchon/ArduinoJson@7.0.0" \
              --project-option "build_unflags=-std=gnu++11" \
              --project-option "build_flags=-std=gnu++20"
          done
      - name: Compile lifecycle smoke test
        if: matrix.board == 'esp32dev'
        run: |
          pio ci tests/esp32/LifecycleSmoke \
            --board esp32dev \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "lib_deps=bblanchon/ArduinoJson@7.0.0" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, clang-format, host-tests, build-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 == "## " version {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
