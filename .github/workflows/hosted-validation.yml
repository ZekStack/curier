name: Hosted validation

on:
  push:
    branches:
      - strata-migration

permissions:
  contents: read

env:
  PIOARDUINO_VERSION: 6.1.19
  STRATA_VERSION: v0.1.2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata and whitespace
        run: |
          git diff --check HEAD
          python3 -m json.tool library.json >/dev/null
          python3 scripts/validate_release_version.py
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          find src tests examples extras -type f \
            \( -name '*.h' -o -name '*.cpp' -o -name '*.ino' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: Audit source ownership rules
        run: |
          set -e
          if grep -RInE '#include[[:space:]]+[<"](Accord|Flow|Fresh|Link|Phase|Pulse|Seal|Signal|Tempo|Trace|Worker)\.h[>"]' src; then
            echo "Curier must not depend on another ZekStack library except Strata"
            exit 1
          fi
          if grep -RInE '"aesgcm"|Content-Encoding:[[:space:]]+aesgcm' src; then
            echo "Legacy aesgcm encoding is forbidden"
            exit 1
          fi
          if grep -RIn '_impl\.release' src; then
            echo "Curier must not leak its implementation from callback destruction"
            exit 1
          fi
          if grep -RIn 'deleteCurrent' src; then
            echo "Curier workers must be deleted by the owner task"
            exit 1
          fi
          if grep -RInE '#include[[:space:]]+[<"]esp_heap_caps\.h[>"]|freertos/idf_additions\.h' src; then
            echo "Curier must not depend on ESP-IDF allocation internals"
            exit 1
          fi
          if grep -RInE 'heap_caps_|MALLOC_CAP_|ps_malloc|xTaskCreate|vTaskDelete|xQueueCreate|xSemaphoreCreate|std::make_unique|std::make_shared|(^|[^[:alnum:]_])malloc[[:space:]]*\(|(^|[^[:alnum:]_])calloc[[:space:]]*\(|(^|[^[:alnum:]_])realloc[[:space:]]*\(|(^|[^[:alnum:]_])free[[:space:]]*\(|(^|[^[:alnum:]_])new[[:space:](]|(^|[^[:alnum:]_])delete[[:space:](]' src; then
            echo "Curier-owned allocation and FreeRTOS storage must route through Strata"
            exit 1
          fi
      - name: Fetch Strata host backend
        run: |
          STRATA_DIR="$RUNNER_TEMP/strata"
          git clone --depth 1 --branch "${STRATA_VERSION}" https://github.com/ZekStack/strata.git "$STRATA_DIR"
          echo "STRATA_DIR=$STRATA_DIR" >> "$GITHUB_ENV"
      - name: Build and run host protocol tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -I"$STRATA_DIR/src" \
            -Itests/host/stubs \
            -Isrc \
            "$STRATA_DIR/src/strata/Allocation.cpp" \
            "$STRATA_DIR/src/strata/internal/PlatformGeneric.cpp" \
            src/internal/CurierProtocol.cpp \
            src/internal/CurierRetry.cpp \
            tests/host/test_retry_protocol.cpp \
            -o /tmp/curier-host-tests
          /tmp/curier-host-tests
      - name: Install crypto dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"
          pio pkg install -g -l "bblanchon/ArduinoJson@7.0.0"
      - name: Build and run RFC 8291 and VAPID tests
        run: |
          ARDUINOJSON_HEADER="$(find ~/.platformio -type f -path '*/ArduinoJson/src/ArduinoJson.h' -print -quit)"
          test -n "$ARDUINOJSON_HEADER"
          ARDUINOJSON_INCLUDE="$(dirname "$ARDUINOJSON_HEADER")"
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -I"$STRATA_DIR/src" \
            -I"$ARDUINOJSON_INCLUDE" \
            -Itests/host/stubs \
            -Isrc \
            "$STRATA_DIR/src/strata/Allocation.cpp" \
            "$STRATA_DIR/src/strata/internal/PlatformGeneric.cpp" \
            src/internal/CurierCrypto.cpp \
            tests/host/test_crypto.cpp \
            -lmbedtls -lmbedx509 -lmbedcrypto \
            -o /tmp/curier-crypto-tests
          /tmp/curier-crypto-tests
