name: One-shot format fix

on:
  push:
    branches:
      - strata-migration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: strata-migration
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format changed sources
        run: |
          find src tests examples extras -type f \
            \( -name '*.h' -o -name '*.cpp' -o -name '*.ino' \) -print0 \
            | xargs -0 clang-format -i
          rm .github/workflows/format-fix.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples extras .github/workflows/format-fix.yml
          git diff --cached --check
          git commit -m "Format Strata migration changes"
          git push origin HEAD:strata-migration
