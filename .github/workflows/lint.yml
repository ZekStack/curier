name: Lint

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  whitespace:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace
        run: git diff --check HEAD

  metadata:
    runs-on: [self-hosted, zekstack-ci]
    steps:
      - uses: actions/checkout@v4
      - name: Parse library metadata
        run: |
          python3 -m json.tool library.json >/dev/null
          python3 scripts/validate_release_version.py
